name: Publish Package to npmjs
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Auto Test with Coverage
        run: npm run coverage
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
      - name: Create or update GitHub Release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "See CHANGELOG.md for release notes." > "$NOTES_FILE"
          fi

          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE" \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE" \
              "${RELEASE_FLAGS[@]}"
          fi
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Resolve npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE_NAME@$PACKAGE_VERSION has not been published yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to NPMJS
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --tag "${NPM_TAG}"
        env:
          NPM_TAG: ${{ steps.npm-dist-tag.outputs.tag }}
